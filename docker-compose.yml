services:
  node-proxy:
    image: wwwzhouhui569/litellm-agentrouter:latest
    container_name: litellm-node-proxy
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const net=require(''net'');const s=net.connect(4000,()=>{s.end();process.exit(0)});s.on(''error'',()=>process.exit(1));"',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    command: ["node", "/app/node/main.mjs"]

  litellm-proxy:
    image: wwwzhouhui569/litellm-agentrouter:latest
    container_name: litellm-python-proxy
    ports:
      - "${PORT:-4000}:4000"
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    env_file:
      - .env
    environment:
      ADMIN_PROXY_BASE_URL: http://127.0.0.1:4000
      ADMIN_NODE_PROXY_BASE_URL: http://node-proxy:4000
      CONFIG_BACKEND: db
      CONFIG_DB_PATH: /app/data/config.sqlite3
      TELEMETRY_DB_PATH: /app/data/telemetry.sqlite3
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      node-proxy:
        condition: service_healthy
    networks:
      default:
        aliases:
          - litellm

networks:
  default:
    name: litellm-network
